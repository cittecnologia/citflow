server {
    listen 80;
    server_name citflow.com.br www.citflow.com.br;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Compressão gzip
    gzip on;
    gzip_types text/html text/css text/plain text/xml application/xml
               application/javascript text/javascript application/json
               image/svg+xml;
    gzip_min_length 1024;

    # Bloqueia acesso web ao diretório .git (relevante em deploy via git pull)
    location ~ /\.git {
        deny all;
        return 404;
    }

    # Arquivos de SEO: sem cache longo, para poder corrigir rápido
    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }
    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
        types { } default_type application/xml;
        access_log off;
    }

    # HTML sempre revalidado — deploy novo aparece na hora
    location = / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Cache longo para assets estáticos
    location ~* \.(css|js|woff2?|ttf|svg|png|jpg|jpeg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 404 real para URLs inexistentes (evita soft 404 aos olhos do Google)
    location / {
        try_files $uri $uri/ =404;
    }

    # Oculta versão do nginx
    server_tokens off;

    # Headers de segurança
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
